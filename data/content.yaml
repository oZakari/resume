Profile: >
  Cloud Solutions Architect and Platform Engineer with 10+ years of experience leading Azure Landing Zones (ALZ) strategy, Infrastructure-as-Code platforms, enterprise cloud architecture, and large-scale customer migrations to Azure across Infrastructure and Apps workloads.
  Creator and lead of the ALZ-Bicep framework and Azure Verified Modules (AVM), adopted across hundreds of thousands of deployments and tens of thousands of customers, and unblocking millions of dollars in customer revenue through high-severity technical escalations.
  Deep expertise in Bicep, Terraform, and PowerShell automation, CI/CD pipeline engineering, and Well-Architected reliability practices.
  Proven technical lead driving complex enterprise customer engagements, executive-level advisory, and developer enablement across Microsoft's engineering and field organizations.

RecentHighlights:
  - Header: Azure Landing Zones – Bicep Lead
    Details:
      - Built and led the ALZ-Bicep framework from the ground up, architecting a modular platform of 19 Azure Verified Modules deployed 33,000+ times across 560+ enterprise customers, delivering end-to-end customization, Azure Deployment Stacks integration, decoupled policy management, and modern Bicep parameter file support.
      - Recognized as ALZ Lead and Cloud Adoption Framework Evangelist (3x).
  - Header: Azure Verified Modules (AVM)
    Details:
      - Built and own 14 Azure Verified Modules for Platform Landing Zones, adopted across hundreds of thousands of deployments and tens of thousands of customers.
      - Recognized as Platinum Contributor, Community Champion, and Bicep Coach for sustained open-source contributions and cross-team enablement.
  - Header: APRL Technical Lead
    Details:
      - Led architecture, development, and ownership of the Azure Proactive Resiliency Library (APRL), stabilizing CI/CD pipelines, standardizing metadata schemas, and implementing secure PowerShell code signing.
      - Helped scale APRL into a company-wide customer offering, partnering across engineering teams to productize the framework and deliver it to customers at scale as a fiscal-year priority.
  - Header: Customer Engagements & Technical Escalation
    Details:
      - Owned Microsoft-side resolution for Boeing's air-gapped GitHub Copilot application and database modernization, protecting a $600M data center exit and setting the reference pattern for government/regulated-industry customers.
      - Served as the primary technical escalation point for Microsoft's field CSAs across high-severity, cross-technology customer issues, unblocking millions of dollars in customer revenue — including $1.3M (Boeing Airlines), $300K ACR (First Citizens Bank), and $120K ACR (Brown & Brown, Cox Auto) — by rapidly resolving complex challenges spanning infrastructure, code, and architecture.
      - Led Well-Architected Reliability Assessments (WARAs) and remediation engagements, driving adoption of resiliency best practices across enterprise environments.
  - Header: Community & Field Enablement
    Details:
      - Managed the 3,850-member ALZ-Bicep channel, presented at community calls (90–120 attendees, 2,500+ views), delivered Level-Up training sessions.
      - Mentored 25+ engineers and both senior and early-career CSAs on IaC, DevOps, CAF, and WAF best practices.

