Profile: >
  Cloud Solutions Architect with 10+ years of experience leading enterprise Azure architecture, Infrastructure-as-Code
  strategy, and reliability engagements for Fortune 500 and public-sector customers. Architect and lead of the Azure
  Landing Zones (ALZ) Bicep framework and Azure Verified Modules (AVM), driving adoption across hundreds of thousands
  of deployments and tens of thousands of customers. Trusted technical advisor and executive-level escalation point for
  governance, resiliency, and complex cloud migrations. Proven track record influencing Microsoft product roadmaps and
  setting technical direction across engineering and customer organizations.

RecentHighlights:
  - Header: Azure Landing Zones – Bicep Lead
    Details:
      - Led the end-to-end design and launch of the ALZ Platform Landing Zone, rebuilding it around 19 Azure Verified
        Modules to power tens of thousands of enterprise deployments across hundreds of customers.
      - Recognized as ALZ Lead and three-time Cloud Adoption Framework Evangelist.
  - Header: Enterprise Customer Engagements & Executive Escalations
    Details:
      - Owned Microsoft-side resolution for a Fortune 100 customer's air-gapped GitHub Copilot application and
        database modernization, coordinating Product Groups, GitHub engineering, and executive stakeholders on a
        precedent-setting government/regulated-industry engagement.
      - Delivered a first-of-its-kind Bicep Workshop Plus pilot and led a major financial institution's ALZ Terraform
        Accelerator adoption, accelerating IaC maturity and enabling new Azure workload onboarding.
  - Header: Well-Architected Reliability Leadership
    Details:
      - Led Well-Architected Reliability Assessments (WARAs) and remediation engagements for enterprise customers
        across insurance, energy, and public-sector organizations, driving adoption of resiliency best practices.
  - Header: Product & Governance Influence
    Details:
      - Partnered with Microsoft product groups (RBAC, ARM, GitHub Copilot) to influence platform readiness, converting
        customer-surfaced governance and security gaps into scheduled engineering workstreams.
  - Header: Community & Field Enablement
    Details:
      - Managed the 3,850-member ALZ-Bicep channel, presented at community calls (90–120 attendees, 2,500+ views),
        and delivered Level-Up training sessions.
      - Mentored 25+ engineers and both senior and early-career CSAs on IaC, DevOps, CAF, and WAF best practices.

